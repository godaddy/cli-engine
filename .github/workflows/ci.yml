name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  changes:
    name: Detect Rust changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          # Avoids unnecessary Rust jobs running on `push` events; paths-filter
          # needs the prior commit so it can do a proper diff, else it sees all
          # files as new
          fetch-depth: 2

      # Doing a check here instead of using paths in our trigger conditions
      # so that branch protection rules which require our Rust jobs aren't
      # unsatisfied
      - name: Filter
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d #v4.0.3
        with:
          filters: |
            rust:
              - "cli-engine/**"
              - "cli-engine-macros/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - ".github/workflows/ci.yml"

  rust:
    name: Rust
    needs: changes
    # `always()` overrides the implicit skip-on-upstream-failure default, so
    # a `changes` failure (e.g. paths-filter erroring) can't silently skip
    # the one check branch protection requires — it fails safe into running
    # Rust CI rather than trusting an output that was never produced.
    if: |
      always() &&
      (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 #v1.16.1
        with:
          components: clippy, rustfmt

      - name: Format
        run: cargo fmt --all --check

      - name: Check
        run: cargo check --all-targets && cargo check --all-targets --features pkce-auth

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings && cargo clippy --all-targets --features pkce-auth -- -D warnings

      - name: Test
        run: cargo test --all-targets && cargo test --all-targets --features pkce-auth

      - name: Docs
        run: RUSTDOCFLAGS='-D warnings' cargo doc --no-deps && RUSTDOCFLAGS='-D warnings' cargo doc --no-deps --features pkce-auth

      - name: Doc Tests
        run: cargo test --doc && cargo test --doc --features pkce-auth

      - name: Check module size limits
        run: ./cli-engine/scripts/check-module-size.sh

      # cli-engine depends on the new cli-engine-macros crate (path + version
      # dependency), which isn't on crates.io until its first real release
      # (see release.yml) — until then, the dry run can't resolve it, which
      # is expected and not a real publish problem. Tolerate specifically
      # that failure; anything else still fails the check.
      - name: Publish dry run
        run: |
          if ! output=$(cargo publish --dry-run -p cli-engine 2>&1); then
            echo "$output"
            if echo "$output" | grep -q 'no matching package named `cli-engine-macros` found'; then
              echo "cli-engine-macros isn't on crates.io yet (expected pre-first-release); not a real dry-run failure"
            else
              exit 1
            fi
          fi
